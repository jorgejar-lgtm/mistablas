<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mis Listas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #1a237e; }
        .subtitulo { text-align: center; color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus { border-color: #1a237e; outline: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #1a237e;
            color: white;
        }
        .btn:hover { opacity: 0.9; }
        .btn-verde { background: #2e7d32; margin-top: 10px; }
        .mensaje {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
        .mensaje.error { display: block; background: #ffebee; color: #c62828; }
        .mensaje.exito { display: block; background: #e8f5e9; color: #2e7d32; }
        .toggle { text-align: center; margin-top: 15px; }
        .toggle a { color: #1a237e; cursor: pointer; font-weight: bold; }
        #registro-form { display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>📋 Mis Listas</h1>
        <p class="subtitulo">Inicia sesión o regístrate</p>
        
        <div id="mensaje" class="mensaje"></div>
        
        <!-- Login -->
        <div id="login-form">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="login-email" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="login-password" placeholder="********">
            </div>
            <button class="btn" onclick="iniciarSesion()">🔑 Iniciar Sesión</button>
            <div class="toggle">¿No tienes cuenta? <a onclick="mostrarRegistro()">Regístrate</a></div>
        </div>
        
        <!-- Registro -->
        <div id="registro-form">
            <div class="form-group">
                <label>👤 Nombre</label>
                <input type="text" id="reg-nombre" placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="reg-email" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="reg-password" placeholder="********">
            </div>
            <button class="btn btn-verde" onclick="registrarUsuario()">📝 Registrarse</button>
            <div class="toggle">¿Ya tienes cuenta? <a onclick="mostrarLogin()">Inicia sesión</a></div>
        </div>
    </div>

    <script>
        function mostrarMensaje(texto, tipo) {
            const el = document.getElementById('mensaje');
            el.textContent = texto;
            el.className = 'mensaje ' + tipo;
            setTimeout(() => { el.className = 'mensaje'; }, 4000);
        }

        function mostrarRegistro() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('registro-form').style.display = 'block';
        }

        function mostrarLogin() {
            document.getElementById('registro-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        }

        function registrarUsuario() {
            const nombre = document.getElementById('reg-nombre').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!nombre || !email || !password) {
                mostrarMensaje('❌ Completa todos los campos', 'error');
                return;
            }

            fetch('api.php?action=registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    mostrarMensaje('✅ Registro exitoso. ¡Inicia sesión!', 'exito');
                    mostrarLogin();
                    document.getElementById('login-email').value = email;
                } else {
                    mostrarMensaje('❌ ' + (data.error || 'Error al registrar'), 'error');
                }
            })
            .catch(() => mostrarMensaje('❌ Error de conexión', 'error'));
        }

        function iniciarSesion() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!email || !password) {
                mostrarMensaje('❌ Completa todos los campos', 'error');
                return;
            }

            fetch('api.php?action=login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('usuario_id', data.usuario.id_usuario);
                    localStorage.setItem('usuario_nombre', data.usuario.nombre);
                    localStorage.setItem('usuario_email', data.usuario.email);
                    window.location.href = 'index.html';
                } else {
                    mostrarMensaje('❌ ' + (data.error || 'Error al iniciar sesión'), 'error');
                }
            })
            .catch(() => mostrarMensaje('❌ Error de conexión', 'error'));
        }

        if (localStorage.getItem('usuario_id')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
